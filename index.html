<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life never ends in the city</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>LIFE NEVER ENDS IN THE CITY</h1>
  <canvas id="game" width="256" height="240"></canvas>
  <p class="help">&larr; &rarr; / A D: walk &nbsp;&nbsp; Space / &uarr; / W: jump<br>Helicopter: arrows / WASD: fly &nbsp;&nbsp; Space / X: shoot<br>Touchscreen: on-screen buttons &nbsp;&nbsp; Gamepad: D-pad / stick + A (jump) / X (shoot)</p>
  <div id="touch-controls" aria-label="Touch controls">
    <div class="touch-directions">
      <button type="button" data-control="left" aria-label="Move left">&larr;</button>
      <div class="touch-vertical">
        <button type="button" data-control="up" aria-label="Move up">&uarr;</button>
        <button type="button" data-control="down" aria-label="Move down">&darr;</button>
      </div>
      <button type="button" data-control="right" aria-label="Move right">&rarr;</button>
    </div>
    <div class="touch-actions">
      <button type="button" data-control="jump" aria-label="Jump">JUMP</button>
      <button type="button" data-control="fire" aria-label="Fire">FIRE</button>
    </div>
  </div>

  <script src="src/config.js"></script>
  <script src="src/input.js"></script>
  <script src="src/sound.js"></script>
  <script src="src/sprites.js"></script>
  <script src="src/background.js"></script>
  <script src="src/level.js"></script>
  <script src="src/effects.js"></script>
  <script src="src/ending.js"></script>
  <script src="src/player.js"></script>
  <script src="src/enemies/enemy.js"></script>
  <script src="src/enemies/sirenhead.js"></script>
  <script src="src/enemies/witherskeleton.js"></script>
  <script src="src/enemies/train.js"></script>
  <script src="src/enemies/venom.js"></script>
  <script src="src/enemies/herobrine.js"></script>
  <script src="src/enemies/momo.js"></script>
  <script src="src/enemies/piranha.js"></script>
  <script src="src/enemies/godzilla.js"></script>
  <script src="src/objects/rocket.js"></script>
  <script src="src/objects/house.js"></script>
  <script src="src/objects/bombs.js"></script>
  <script src="src/objects/crash.js"></script>
  <script src="src/objects/icecream.js"></script>
  <script src="src/objects/hospital.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
